# nginx config for the Jhanvi Cars frontend (React single-page app).
# /api/* is routed to the API gateway by the Ingress and never reaches this server.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets (Vite adds a content hash): cache for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must never be cached, so a new deploy shows up on a normal refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Kubernetes / load balancer health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # App routes like /admin are handled by React: fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
