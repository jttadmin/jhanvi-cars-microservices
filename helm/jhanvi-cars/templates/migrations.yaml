{{- $root := . -}}

{{- $migrationImages := dict
  "auth" "authService"
  "user" "userService"
  "driver" "driverService"
  "booking" "bookingService"
  "vehicle" "vehicleService"
  "payment" "paymentService"
  "notification" "notificationService"
}}

{{- range $name, $service := .Values.services }}
{{- if and $service.enabled $service.dbSchema }}

{{- $imageKey := index $migrationImages $name }}
{{- $image := index $root.Values.images $imageKey }}

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name | kebabcase }}-migration
  namespace: {{ $root.Values.global.namespace }}
  labels:
    {{- include "jhanvi-cars.labels" $root | nindent 4 }}
    app: {{ $name | kebabcase }}-migration

spec:
  backoffLimit: 4

  template:
    metadata:
      labels:
        app: {{ $name | kebabcase }}-migration

    spec:
      restartPolicy: OnFailure

      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is reachable."

      containers:
        - name: {{ $name | kebabcase }}-migration
          image: "{{ $image.repository }}:{{ $image.tag }}"
          imagePullPolicy: IfNotPresent

          command:
            - npm
            - run
            - migrate

          envFrom:
            - configMapRef:
                name: jhanvi-cars-config
            - secretRef:
                name: {{ $root.Values.secrets.existingSecret }}

          env:
            - name: DB_SCHEMA
              value: "{{ $service.dbSchema }}"

---
{{- end }}
{{- end }}
