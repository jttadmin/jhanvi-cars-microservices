{{- $root := . -}}



{{- range $name, $service := .Values.services }}
{{- if and $service.enabled $service.dbSchema }}

{{- $image := index $root.Values.images.migrations $name }}

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name | kebabcase }}-migration
  namespace: {{ $root.Values.global.namespace }}
  labels:
    {{- include "jhanvi-cars.labels" $root | nindent 4 }}
    app: {{ $name | kebabcase }}-migration
  annotations:
    # Argo CD: run as a sync hook on every sync. The old Job is deleted first,
    # so a new image tag never hits the "Job spec is immutable" error.
    # Plain `helm install/upgrade` ignores these annotations.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"

spec:
  backoffLimit: 4

  template:
    metadata:
      labels:
        app: {{ $name | kebabcase }}-migration

    spec:
      restartPolicy: OnFailure

      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is reachable."

      containers:
        - name: {{ $name | kebabcase }}-migration
          image: "{{ $image.repository }}:{{ $image.tag }}"
          imagePullPolicy: IfNotPresent

          command:
            - npm
            - run
            - migrate

          envFrom:
            - configMapRef:
                name: jhanvi-cars-config
            - secretRef:
                name: {{ $root.Values.secrets.existingSecret }}

          env:
            - name: NODE_ENV
              value: "development"

            - name: DB_SCHEMA
              value: "{{ $service.dbSchema }}"

            {{- if eq $name "auth" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $root.Values.secrets.databaseKeys.auth }}
            {{- end }}

---
{{- end }}
{{- end }}
