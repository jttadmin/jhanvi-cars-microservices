{{- $root := . -}}

{{- $serviceImages := dict
  "apiGateway" "apiGateway"
  "auth" "authService"
  "user" "userService"
  "driver" "driverService"
  "booking" "bookingService"
  "vehicle" "vehicleService"
  "payment" "paymentService"
  "notification" "notificationService"
}}

{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
{{- $imageKey := index $serviceImages $name }}
{{- $image := index $root.Values.images $imageKey }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name | kebabcase }}
  namespace: {{ $root.Values.global.namespace }}
  labels:
    {{- include "jhanvi-cars.labels" $root | nindent 4 }}
    app: {{ $name | kebabcase }}
  annotations:
    # Argo CD: roll out after the migration Jobs (wave 1) have completed
    argocd.argoproj.io/sync-wave: "2"

spec:
  replicas: {{ $service.replicas }}

  selector:
    matchLabels:
      app: {{ $name | kebabcase }}

  template:
    metadata:
      labels:
        app: {{ $name | kebabcase }}

    spec:
      containers:
        - name: {{ $name | kebabcase }}

          image: "{{ $image.repository }}:{{ $image.tag }}"
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: {{ $service.port }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: jhanvi-cars-config

            - secretRef:
                name: {{ $root.Values.secrets.existingSecret }}

          env:
            - name: PORT
              value: "{{ $service.port }}"

            {{- if eq $name "auth" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $root.Values.secrets.databaseKeys.auth }}
            {{- else if $service.dbSchema }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $root.Values.secrets.databaseKeys.default }}
            {{- end }}

            {{- if $service.dbSchema }}
            - name: DB_SCHEMA
              value: "{{ $service.dbSchema }}"
            {{- end }}

          resources:
            requests:
              cpu: {{ $service.resources.requests.cpu }}
              memory: {{ $service.resources.requests.memory }}

            limits:
              cpu: {{ $service.resources.limits.cpu }}
              memory: {{ $service.resources.limits.memory }}

---
{{- end }}
{{- end }}
