# ============================================================
# JHANVI CARS - NGINX CONFIGURATION
# ============================================================
#
# Architecture:
#
# Internet
#    |
#    v
# Nginx
#    |
#    +--> auth-service
#    +--> user-service
#    +--> driver-service
#    +--> vehicle-service
#    +--> booking-service
#    +--> payment-service
#    +--> notification-service
#
# ============================================================


# ============================================================
# WORKER CONFIGURATION
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}


# ============================================================
# HTTP CONFIGURATION
# ============================================================

http {

    # --------------------------------------------------------
    # Basic settings
    # --------------------------------------------------------

    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    sendfile on;

    tcp_nopush on;

    tcp_nodelay on;

    keepalive_timeout 65;


    # --------------------------------------------------------
    # Logging
    # --------------------------------------------------------

    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'request_time=$request_time '
        'upstream_response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    error_log /var/log/nginx/error.log warn;


    # ========================================================
    # UPSTREAM SERVICES
    # ========================================================

    # --------------------------------------------------------
    # Authentication Service
    # --------------------------------------------------------

    upstream auth_service {
        server auth-service:3000;
    }


    # --------------------------------------------------------
    # User Service
    # --------------------------------------------------------

    upstream user_service {
        server user-service:3001;
    }


    # --------------------------------------------------------
    # Driver Service
    # --------------------------------------------------------

    upstream driver_service {
        server driver-service:3002;
    }


    # --------------------------------------------------------
    # Vehicle Service
    # --------------------------------------------------------

    upstream vehicle_service {
        server vehicle-service:3003;
    }


    # --------------------------------------------------------
    # Booking Service
    # --------------------------------------------------------

    upstream booking_service {
        server booking-service:3004;
    }


    # --------------------------------------------------------
    # Payment Service
    # --------------------------------------------------------

    upstream payment_service {
        server payment-service:3005;
    }


    # --------------------------------------------------------
    # Notification Service
    # --------------------------------------------------------

    upstream notification_service {
        server notification-service:3006;
    }


    # ========================================================
    # RATE LIMITING
    # ========================================================

    # 10 requests/sec per client IP

    limit_req_zone $binary_remote_addr
        zone=api_limit:10m
        rate=10r/s;


    # ========================================================
    # HTTP SERVER
    # ========================================================

    server {

        listen 80;

        server_name api.jhanvicars.in;


        # ----------------------------------------------------
        # Request body size
        # ----------------------------------------------------

        client_max_body_size 20M;


        # ====================================================
        # HEALTH CHECK
        # ====================================================

        location = /health {

            access_log off;

            return 200 'OK';

            add_header Content-Type text/plain;
        }


        # ====================================================
        # AUTH SERVICE
        # ====================================================

        location /api/auth/ {

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://auth_service;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;

            proxy_send_timeout 30s;

            proxy_read_timeout 30s;
        }


        # ====================================================
        # USER SERVICE
        # ====================================================

        location /api/users/ {

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://user_service;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;

            proxy_send_timeout 30s;

            proxy_read_timeout 30s;
        }


        # ====================================================
        # DRIVER SERVICE
        # ====================================================

        location /api/drivers/ {

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://driver_service;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;

            proxy_send_timeout 30s;

            proxy_read_timeout 30s;
        }


        # ====================================================
        # VEHICLE SERVICE
        # ====================================================

        location /api/vehicles/ {

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://vehicle_service;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;

            proxy_send_timeout 30s;

            proxy_read_timeout 30s;
        }


        # ====================================================
        # BOOKING SERVICE
        # ====================================================

        location /api/bookings/ {

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://booking_service;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;

            proxy_send_timeout 30s;

            proxy_read_timeout 60s;
        }


        # ====================================================
        # PAYMENT SERVICE
        # ====================================================

        location /api/payments/ {

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://payment_service;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;

            proxy_send_timeout 30s;

            proxy_read_timeout 60s;
        }


        # ====================================================
        # NOTIFICATION SERVICE
        # ====================================================

        location /api/notifications/ {

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://notification_service;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;

            proxy_send_timeout 30s;

            proxy_read_timeout 30s;
        }


        # ====================================================
        # DEFAULT / UNKNOWN ROUTES
        # ====================================================

        location / {

            return 404;
        }
    }
}
