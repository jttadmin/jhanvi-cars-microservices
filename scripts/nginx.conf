upstream jhanvi_backend {
    least_conn;

    server 10.0.1.10:3000;
    server 10.0.1.11:3000;
    server 10.0.1.12:3000;
}

server {
    listen 80;
    server_name api.jhanvicars.in;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.jhanvicars.in;

    ssl_certificate /etc/letsencrypt/live/api.jhanvicars.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.jhanvicars.in/privkey.pem;

    client_max_body_size 20M;

    location = /health {
        proxy_pass http://jhanvi_backend;
    }

    location /api/ {

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://jhanvi_backend;
    }

    access_log /var/log/nginx/jhanvi-access.log;
    error_log /var/log/nginx/jhanvi-error.log;
}
