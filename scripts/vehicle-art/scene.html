<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const params = new URLSearchParams(location.search);
const which = params.get('v') || 'comfort';
const W = 960, H = 640;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
{
  const env = new THREE.Scene();
  env.background = new THREE.Color(0x2b2f35);
  const lightMat = (i) => new THREE.MeshBasicMaterial({ color: new THREE.Color(i, i, i), side: THREE.DoubleSide });
  const panel = (w, h, i, pos, rot) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), lightMat(i)); m.position.set(...pos); m.rotation.set(...rot); env.add(m); };
  panel(14, 3, 6, [0, 9, 0], [Math.PI / 2, 0, 0]);          // long overhead softbox
  panel(3, 10, 3, [-9, 4, 0], [0, Math.PI / 2, 0]);         // left strip
  panel(3, 10, 3, [9, 4, 2], [0, -Math.PI / 2, 0]);         // right strip
  panel(10, 2, 2.2, [0, 3, 10], [0, Math.PI, 0]);           // front fill
  panel(40, 40, 0.55, [0, -0.5, 0], [-Math.PI / 2, 0, 0]);  // light floor bounce
  scene.environment = pmrem.fromScene(env, 0.03).texture;
}

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8dde3, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(3, 9, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -6; sun.shadow.camera.right = 6;
sun.shadow.camera.top = 6; sun.shadow.camera.bottom = -6;
sun.shadow.radius = 8;
sun.shadow.bias = -0.0005;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.28 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// soft contact shadow under the vehicle
{
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 10, 128, 128, 128);
  grd.addColorStop(0, 'rgba(0,0,0,0.55)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 2.9), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  blob.rotation.x = -Math.PI / 2; blob.position.y = 0.002;
  scene.add(blob);
}

// ---------- materials ----------
const paint = (hex, opts = {}) => new THREE.MeshPhysicalMaterial({
  color: hex, metalness: opts.metalness ?? 0.45, roughness: opts.roughness ?? 0.22,
  clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 1.25,
});
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x0f151b, metalness: 0.2, roughness: 0.02, clearcoat: 1, envMapIntensity: 2.2 });
const rubber = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.85 });
const alloy = new THREE.MeshStandardMaterial({ color: 0xcfd4d9, metalness: 1, roughness: 0.22 });
const darkTrim = new THREE.MeshStandardMaterial({ color: 0x1a1c1f, roughness: 0.55 });
const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff4d6, emissiveIntensity: 0.9, roughness: 0.1 });
const tailMat = new THREE.MeshStandardMaterial({ color: 0xc8231d, emissive: 0x8a0f0a, emissiveIntensity: 0.6, roughness: 0.2 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xe9edf1, metalness: 1, roughness: 0.1 });

// ---------- helpers: SVG profile (320x200, y down) -> 3D ----------
const K = 0.02;
function profile(d, groundY) {
  const data = new SVGLoader().parse(`<svg xmlns="http://www.w3.org/2000/svg"><path d="${d}"/></svg>`);
  const shapes = data.paths[0].toShapes(true);
  // map: X = (x-160)*K, Y = (groundY - y)*K
  return shapes.map((s) => {
    const pts = s.getPoints(48).map((p) => new THREE.Vector2((p.x - 160) * K, (groundY - p.y) * K));
    return new THREE.Shape(pts);
  });
}
function extrude(shapes, width, mat, bevel = 0.1, z = 0) {
  const geo = new THREE.ExtrudeGeometry(shapes, {
    depth: Math.max(width - 2 * bevel, 0.01), bevelEnabled: bevel > 0,
    bevelThickness: bevel, bevelSize: bevel * 0.9, bevelSegments: 6, curveSegments: 24,
  });
  geo.translate(0, 0, -(width - 2 * bevel) / 2 + z);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
const sv = (x, y, g) => new THREE.Vector3((x - 160) * K, (g - y) * K, 0);

// glass slab across the car between two SVG points (windshield / rear glass)
function glassStrip(p1, p2, g, width, lift = 0.03, mat = glassMat) {
  const a = sv(p1[0], p1[1], g), b = sv(p2[0], p2[1], g);
  const len = a.distanceTo(b);
  const m = new THREE.Mesh(new THREE.BoxGeometry(len, 0.02, width), mat);
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  m.position.copy(a.clone().add(b).multiplyScalar(0.5));
  m.rotation.z = ang;
  // nudge outward (upward side of the slope)
  let n = new THREE.Vector3(-Math.sin(ang), Math.cos(ang), 0);
  if (n.y < 0) n.negate();
  m.position.add(n.multiplyScalar(lift));
  return m;
}

// Curved glass band that hugs the body outline between two SVG x positions (top side only).
function glassBand(shape, x1, x2, yBelow, g, width, off = 0.215, thick = 0.03) {
  const lo = (Math.min(x1, x2) - 160) * K, hi = (Math.max(x1, x2) - 160) * K, yMin = (g - yBelow) * K;
  const pts = shape.getPoints(400).filter((p) => p.x >= lo && p.x <= hi && p.y >= yMin);
  pts.sort((a, b) => a.x - b.x);
  const outer = [], inner = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(i - 1, 0)], b = pts[Math.min(i + 1, pts.length - 1)];
    let nx = -(b.y - a.y), ny = b.x - a.x; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
    if (ny < 0) { nx = -nx; ny = -ny; }
    outer.push(new THREE.Vector2(pts[i].x + nx * (off + thick), pts[i].y + ny * (off + thick)));
    inner.push(new THREE.Vector2(pts[i].x + nx * off, pts[i].y + ny * off));
  }
  const band = new THREE.Shape([...outer, ...inner.reverse()]);
  const geo = new THREE.ExtrudeGeometry(band, { depth: width, bevelEnabled: false });
  geo.translate(0, 0, -width / 2);
  return new THREE.Mesh(geo, glassMat);
}

function wheel(r, tireW, spokes = 5) {
  const g = new THREE.Group();
  const tire = new THREE.Mesh(new THREE.CylinderGeometry(r, r, tireW, 48), rubber);
  tire.rotation.x = Math.PI / 2; tire.castShadow = true; g.add(tire);
  const side = new THREE.Mesh(new THREE.TorusGeometry(r * 0.86, r * 0.14, 16, 48), rubber);
  side.position.z = tireW / 2 - r * 0.06; g.add(side);
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.66, r * 0.66, tireW * 0.82, 40), alloy);
  rim.rotation.x = Math.PI / 2; rim.position.z = 0.012; g.add(rim);
  const dish = new THREE.Mesh(new THREE.CircleGeometry(r * 0.64, 40), new THREE.MeshStandardMaterial({ color: 0x8f969d, metalness: 1, roughness: 0.3 }));
  dish.position.z = tireW / 2 * 0.82 + 0.014; g.add(dish);
  for (let i = 0; i < spokes; i++) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(r * 0.2, r * 0.62, 0.06), alloy);
    s.position.z = tireW / 2 * 0.82 + 0.03;
    s.rotation.z = (i / spokes) * Math.PI * 2;
    s.translateY(r * 0.32);
    g.add(s);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.16, r * 0.16, 0.08, 24), chrome);
  hub.rotation.x = Math.PI / 2; hub.position.z = tireW / 2 * 0.82 + 0.05; g.add(hub);
  return g;
}

// dark wheel-arch liner disc on each body side
function archLiner(cx, cy, r, g, zSide) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(r * K, 40, 0, Math.PI), darkTrim);
  m.position.set((cx - 160) * K, (g - cy) * K, zSide);
  if (zSide < 0) m.rotation.y = Math.PI;
  return m;
}

function addWheels(group, list, g, bodyW, tireW, spokes) {
  for (const [cx, cy, r] of list) {
    for (const side of [1, -1]) {
      const w = wheel(r * K, tireW, spokes);
      w.position.set((cx - 160) * K, (g - cy) * K, side * (bodyW / 2 - tireW / 2 + 0.06));
      if (side < 0) w.rotation.y = Math.PI;
      group.add(w);
      group.add(archLiner(cx, cy - 1, r + 6, g, side * (bodyW / 2 + 0.004)));
    }
  }
}

function box(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; return m;
}

// ---------- vehicles ----------
function car(cfg) {
  const { g, body, windows, wind, rear, W, color, wheels, tireW, spokes, pillars, head, tail, mirror, belt, extra } = cfg;
  const grp = new THREE.Group();
  const bodyShape = profile(body, g)[0];
  const bodyMesh = extrude([bodyShape], W, paint(color, cfg.paintOpts), 0.22);
  grp.add(bodyMesh);
  // side glass (slightly proud of the body sides)
  grp.add(extrude(profile(windows, g), W + 0.03, glassMat, 0.0));
  // windshield + rear glass across the top
  grp.add(glassBand(bodyShape, wind[0][0], wind[1][0], wind[0][1] + 4, g, W - 0.62));
  grp.add(glassBand(bodyShape, rear[0][0], rear[1][0], rear[0][1] + 4, g, W - 0.62));
  // pillars over the side glass
  for (const [x, y1, y2] of pillars) {
    const a = sv(x, y1, g), b = sv(x, y2, g);
    for (const s of [1, -1]) grp.add(box(0.11, a.y - b.y, 0.02, paint(color, cfg.paintOpts), a.x, (a.y + b.y) / 2, s * (W / 2 + 0.02)));
  }
  // chrome belt line
  if (belt) for (const s of [1, -1]) {
    const a = sv(belt[0], belt[2], g), b = sv(belt[1], belt[2], g);
    grp.add(box(b.x - a.x, 0.025, 0.02, chrome, (a.x + b.x) / 2, a.y, s * (W / 2 + 0.03)));
  }
  // lights + grille on the real front / rear faces of the body
  bodyMesh.geometry.computeBoundingBox();
  const bb = bodyMesh.geometry.boundingBox;
  const hy = sv(0, head[1], g).y, ty = sv(0, tail[1], g).y;
  for (const s of [1, -1]) {
    grp.add(box(0.06, head[2] * K, 0.46, headMat, bb.max.x - 0.06, hy, s * (W / 2 - 0.42)));
    grp.add(box(0.06, head[2] * K + 0.06, 0.6, chrome, bb.max.x - 0.08, hy, s * (W / 2 - 0.42)));
    grp.add(box(0.06, tail[2] * K, 0.5, tailMat, bb.min.x + 0.05, ty, s * (W / 2 - 0.38)));
    const mp = sv(mirror[0], mirror[1], g);
    grp.add(box(0.18, 0.12, 0.2, paint(color, cfg.paintOpts), mp.x, mp.y, s * (W / 2 + 0.12)));
  }
  grp.add(box(0.05, 0.2, W - 1.25, darkTrim, bb.max.x - 0.04, hy - 0.04, 0));               // grille
  grp.add(box(0.05, 0.1, W - 0.6, darkTrim, bb.max.x - 0.06, sv(0, head[1] + 20, g).y, 0)); // lower intake
  grp.add(box(0.05, 0.08, W - 0.5, chrome, bb.min.x + 0.04, ty - 0.18, 0));                 // rear trim
  addWheels(grp, wheels, g, W, tireW, spokes);
  if (extra) extra(grp, g, W);
  return grp;
}

const VEHICLES = {
  comfort: () => car({
    g: 176, W: 2.0, color: 0xaeb7c1, tireW: 0.42, spokes: 5,
    body: 'M28 138 C28 121 38 111 58 108 L98 103 C112 80 132 69 162 68 L206 68 C226 68 242 80 258 98 L284 104 C300 107 306 118 306 132 L306 140 C306 147 301 151 294 151 L40 151 C33 151 28 146 28 138 Z',
    windows: 'M108 102 C120 84 136 76 162 75 L200 75 C220 75 234 86 247 101 Z',
    wind: [[256, 98], [210, 70]], rear: [[100, 103], [140, 72]],
    pillars: [[174, 75, 102]], belt: [112, 246, 104],
    head: [304, 116, 7], tail: [30, 118, 8], mirror: [250, 98],
    wheels: [[84, 152, 24], [256, 152, 24]],
  }),
  economy: () => car({
    g: 174, W: 1.9, color: 0xf3f5f7, paintOpts: { metalness: 0.15, roughness: 0.28 }, tireW: 0.4, spokes: 5,
    body: 'M54 140 C54 120 56 102 66 88 C74 76 86 68 106 67 L176 66 C192 66 206 74 222 92 L254 100 C270 103 278 114 278 128 L278 140 C278 147 273 151 266 151 L64 151 C58 151 54 147 54 140 Z',
    windows: 'M78 100 C80 88 88 75 106 74 L174 74 C188 74 200 84 212 99 Z',
    wind: [[220, 92], [182, 68]], rear: [[60, 96], [80, 72]],
    pillars: [[143, 74, 100]], belt: [78, 212, 102],
    head: [276, 113, 7], tail: [56, 106, 12], mirror: [214, 96],
    wheels: [[96, 152, 22], [236, 152, 22]],
  }),
  'comfort-plus': () => car({
    g: 177, W: 2.25, color: 0x1b1f24, paintOpts: { metalness: 0.55, roughness: 0.28 }, tireW: 0.5, spokes: 6,
    body: 'M36 134 L36 104 C36 94 42 88 52 86 L72 84 C82 60 94 50 118 50 L206 50 C222 50 234 58 248 80 L280 88 C294 91 300 102 300 116 L300 134 C300 140 296 144 290 144 L46 144 C40 144 36 140 36 134 Z',
    windows: 'M80 84 C88 64 98 57 118 57 L202 57 C216 57 226 66 238 82 Z',
    wind: [[246, 79], [212, 52]], rear: [[72, 84], [90, 58]],
    pillars: [[137, 57, 84], [189, 57, 84]], belt: [80, 238, 86],
    head: [298, 100, 8], tail: [38, 101, 12], mirror: [240, 82],
    wheels: [[90, 150, 27], [250, 150, 27]],
    extra: (grp, g, W) => {
      for (const s of [1, -1]) {
        const a = sv(104, 46, g), b = sv(216, 46, g);
        grp.add(box(b.x - a.x, 0.06, 0.06, darkTrim, (a.x + b.x) / 2, a.y + 0.3, s * (W / 2 - 0.3)));
        for (const px of [a.x + 0.15, b.x - 0.15]) grp.add(box(0.06, 0.12, 0.06, darkTrim, px, a.y + 0.22, s * (W / 2 - 0.3)));
      }
      const sk = sv(150, 140, g); // dark lower cladding
      for (const s of [1, -1]) grp.add(box(4.2, 0.16, 0.02, darkTrim, sk.x + 0.25, sk.y, s * (W / 2 + 0.02)));
    },
  }),
  auto: () => {
    const g = 172, W = 1.55;
    const grp = new THREE.Group();
    const yellow = paint(0xffc21a, { metalness: 0.1, roughness: 0.3 });
    const green = paint(0x1f9a57, { metalness: 0.25, roughness: 0.3 });
    // canopy (domed, sweeping down at the back)
    grp.add(extrude(profile('M50 114 C44 82 52 54 78 44 C92 38 110 37 136 37 L204 37 C222 37 234 45 240 58 L248 76 L186 76 L186 114 Z', g), W, yellow, 0.14));
    // open passenger side: dark interior panel + bench
    grp.add(extrude(profile('M68 68 C68 60 74 55 82 55 L172 55 C178 55 182 59 182 65 L182 114 L68 114 Z', g), W + 0.03, darkTrim, 0));
    grp.add(extrude(profile('M88 86 C88 80 92 77 98 77 L162 77 C168 77 172 80 172 86 L172 112 L88 112 Z', g), W - 0.25, new THREE.MeshStandardMaterial({ color: 0x3b4148, roughness: 0.7 }), 0.03));
    // windscreen
    grp.add(glassStrip([258, 110], [240, 76], g, W * 0.62 - 0.2, 0.03, new THREE.MeshPhysicalMaterial({ color: 0x6f95a8, roughness: 0.03, metalness: 0.2, clearcoat: 1, envMapIntensity: 2, transparent: true, opacity: 0.85 })));
    const ws = extrude(profile('M190 76 L238 76 C242 76 245 78 247 82 L260 112 L190 112 Z', g), W - 0.36, glassMat, 0.0);
    grp.add(ws);
    // rear tub (full width) and narrower nose
    grp.add(extrude(profile('M46 114 L190 114 L190 152 L64 152 C52 152 46 145 46 134 Z', g), W, green, 0.1));
    grp.add(extrude(profile('M186 114 L258 114 C270 114 278 122 276 134 L270 146 C268 150 264 152 258 152 L186 152 Z', g), W * 0.62, green, 0.1));
    // yellow stripe
    for (const s of [1, -1]) {
      const a = sv(48, 126, g), b = sv(190, 126, g);
      grp.add(box(b.x - a.x, 0.09, 0.02, yellow, (a.x + b.x) / 2, a.y, s * (W / 2 + 0.01)));
    }
    // headlight + tail lamps
    const hp = sv(276, 120, g);
    grp.add(new THREE.Mesh(new THREE.SphereGeometry(0.11, 24, 16), headMat).translateX(hp.x).translateY(hp.y));
    for (const s of [1, -1]) {
      const tp = sv(48, 134, g);
      grp.add(box(0.06, 0.16, 0.18, tailMat, tp.x, tp.y, s * (W / 2 - 0.15)));
    }
    // front mudguard
    const mg = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.05, 12, 32, Math.PI), new THREE.MeshStandardMaterial({ color: 0x0b4f2b, roughness: 0.4 }));
    const fw = sv(248, 152, g); mg.position.set(fw.x, fw.y + 0.02, 0); grp.add(mg);
    // wheels: single front (centered), two rear
    const front = wheel(18 * K, 0.3, 5); front.position.set(fw.x, fw.y, 0.0); grp.add(front);
    for (const s of [1, -1]) {
      const rw = wheel(20 * K, 0.32, 5);
      const p = sv(100, 152, g);
      rw.position.set(p.x, p.y, s * (W / 2 - 0.1));
      if (s < 0) rw.rotation.y = Math.PI;
      grp.add(rw);
      grp.add(archLiner(100, 151, 25, g, s * (W / 2 + 0.004)));
    }
    return grp;
  },
};

const vehicle = VEHICLES[which]();
vehicle.traverse((o) => { if (o.isMesh) { o.castShadow = true; } });
// center on the ground
const box3 = new THREE.Box3().setFromObject(vehicle);
const center = box3.getCenter(new THREE.Vector3());
vehicle.position.x -= center.x;
vehicle.position.z -= center.z;
vehicle.position.y -= box3.min.y;
scene.add(vehicle);

// 3/4 front view (front = +x, right side = +z)
const camera = new THREE.PerspectiveCamera(26, W / H, 0.1, 100);
camera.position.set(8.2, 4.0, 9.6);
const size = new THREE.Box3().setFromObject(vehicle).getSize(new THREE.Vector3());
camera.lookAt(0, size.y * 0.42, 0);
renderer.render(scene, camera);
window.__done = true;
</script>
</body>
</html>
